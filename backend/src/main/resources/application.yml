spring:
  application:
    name: cabane-du-lys-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cabanedulys}
    username: ${DB_USER:cabane}
    password: ${DB_PASSWORD:change_me_in_prod}
  jpa:
    hibernate:
      ddl-auto: none              # Le schéma est entièrement piloté par Flyway.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: simple                 # Dev : cache mémoire. Surchargé en Redis sous Docker.
  mvc:
    problemdetails:
      enabled: true   # RFC 7807 — réponses d'erreur standardisées
  mail:                          # Utilisé uniquement si app.mail.mode=smtp
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true

# Paramètres applicatifs
app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:3000}   # plusieurs origines : séparer par des virgules
  jwt:
    secret: ${JWT_SECRET:dev-secret-please-override-with-a-strong-32-bytes-minimum-key}
    expiration-minutes: 120
  session:
    cookie-name: cdl_session
    cookie-secure: ${SESSION_COOKIE_SECURE:true}          # false uniquement en dev (http://localhost)
    cookie-domain: ${SESSION_COOKIE_DOMAIN:}              # vide = domaine de l'API
  auth:
    magic-link:
      ttl-minutes: ${MAGIC_LINK_TTL_MINUTES:15}
  mail:
    mode: ${MAIL_MODE:log}                                # log (dev) | smtp (prod)
    from: ${MAIL_FROM:La Cabane du Lys <no-reply@cabanedulys.ca>}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: "La Cabane du Lys"
    origin: ${CORS_ORIGIN:http://localhost:3000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_replace_me}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_me}
  shop:
    stock-hold-minutes: ${STOCK_HOLD_MINUTES:30}          # minimum imposé par Stripe Checkout : 30
  base-url: ${BASE_URL:http://localhost:3000}
  rate-limit:
    max-requests: 5       # requêtes max par fenêtre par IP (lien magique) ; autres routes en multiples
    window-seconds: 60    # durée de la fenêtre en secondes
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}   # true uniquement derrière un proxy de confiance qui nettoie l'en-tête
  features:
    magic-link-enabled: ${MAGIC_LINK_ENABLED:true}       # interrupteur d'urgence

logging:
  level:
    org.springframework.security: INFO

# Observabilité
management:
  tracing:
    sampling:
      probability: 1.0   # 100 % en dev ; mettre à 0.1 en production
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}   # activer uniquement avec un SMTP configuré

---
# Profil exécuté dans Docker Compose
spring:
  config:
    activate:
      on-profile: docker
  cache:
    type: redis
  data:
    redis:
      host: redis
