# ============================================================
#  Profil DEV — Lancer sans Docker : mvn spring-boot:run -Dspring-boot.run.profiles=dev
#  Base H2 en mémoire (schéma créé par JPA), Redis toléré absent.
#  Sans Redis : rate limiting et révocation de session en fail-open, passkeys indisponibles.
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:cabanedulys;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false           # Flyway utilise du SQL PostgreSQL (tsvector, GIN…) — désactivé pour H2
  h2:
    console:
      enabled: true
      path: /h2-console      # Interface H2 accessible sur http://localhost:8080/api/h2-console
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 200ms # Délai court : Redis absent → échec rapide, pas de blocage
      timeout: 200ms
  cache:
    type: simple

app:
  session:
    cookie-secure: false     # http://localhost — le cookie serait ignoré avec Secure
  mail:
    mode: log                # le lien magique est écrit dans la console
  features:
    magic-link-enabled: true

logging:
  level:
    com.cabanedulys: DEBUG
    org.hibernate.SQL: WARN
